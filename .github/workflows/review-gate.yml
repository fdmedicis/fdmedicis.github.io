# Cross-model review gate (fdmedicis/cross-model-review-gate), merge mode.
#
# GitHub Pages serves main directly, so the only safe place to stop a bad change
# is before it merges. A second model (Copilot, not Claude) reviews every pull
# request and comments its verdict. Make "review-gate / review gate" a required
# status check in a ruleset for main, and this becomes a hard gate.
#
# Pull requests from forks get no secrets, so the gate fails closed on them.

name: review-gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  review-gate:
    permissions:
      contents: read
      pull-requests: write # verdict comment on the PR
    # Pinned to the exact release commit, not the movable @v1 tag. Bump both together.
    uses: fdmedicis/cross-model-review-gate/.github/workflows/review-gate.yml@0f3e4311ea38416a593a31eadbc9af2409310b82 # v1.1.0
    with:
      provider: copilot # if Copilot gives no verdict, OpenAI reviews (its key is passed below)
      mode: merge
      gate_ref: 0f3e4311ea38416a593a31eadbc9af2409310b82 # v1.1.0, same commit as above
    secrets:
      COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }} # fallback reviewer
